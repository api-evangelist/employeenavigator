apis:
- name: Employee Navigator Identity (OpenID Connect)
  description: 'The Employee Navigator OpenID Connect / OAuth 2.0 authorization server
    that fronts every Employee Navigator API service. Its discovery document is
    served anonymously and advertises authorization code, client credentials, refresh
    token, implicit, device code and CIBA grants, PKCE (S256), DPoP, token
    introspection, token revocation, and front-channel plus back-channel logout, along
    with a named scope for each platform API service.'
  humanURL: https://www.employeenavigator.com/security/
  baseURL: https://www.employeenavigator.com/identity
  tags:
  - OpenID Connect
  - OAuth 2.0
  - Identity
  - Authentication
  properties:
  - type: OpenIDConnect
    url: https://www.employeenavigator.com/identity/.well-known/openid-configuration
  - type: Authentication
    url: authentication/employeenavigator-authentication.yml
  - type: OAuthScopes
    url: scopes/employeenavigator-scopes.yml
- name: Employee Navigator Partner API
  description: 'The Employee Navigator partner REST API program — the Company
    Integration API and the Company Benefit Details API announced in 2022 — used by
    insurance carriers, benefit providers, payroll companies, quoting engines and
    agency management systems to exchange company, plan and member benefit data in
    real time. The service root is live and answers an anonymous health check; every
    resource path is OAuth-protected and the API reference is released to partners
    through Employee Navigator''s technical onboarding rather than a public developer
    portal.'
  humanURL: https://www.employeenavigator.com/modern-integrations/
  baseURL: https://www.employeenavigator.com/api
  tags:
