aid: employeenavigator
name: Employee Navigator
description: 'Employee Navigator is a Bethesda, Maryland benefits administration and
  HR software platform used by insurance brokers, agencies and employers to run open
  enrollment, new hire onboarding, ACA reporting, HR management, PTO tracking and
  integrated payroll. Its integration layer connects employer benefit data to more
  than 600 insurance carriers, payroll providers, TPAs and agency management systems
  through EDI ANSI 834 files, data-exchange feeds and a partner REST API program.
  Employee Navigator published a Company Integration API and a Company Benefit Details
  API for carriers and benefit providers, secured by an OpenID Connect / OAuth 2.0
  authorization server that publicly advertises a per-service scope surface covering
  company integration, plan configuration and management, employee profile, payroll,
  quoting, agency management, evidence of insurability, COBRA, data audit, data sync,
  notifications and webhooks. The API reference itself is partner-gated; the platform
  runs on Microsoft Azure and is audited annually for SOC 2 Type II, HITRUST, NIST,
  GDPR, CCPA and 23 NYCRR 500.'
