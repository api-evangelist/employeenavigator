notes: >-
  Employee Navigator publishes no public OpenAPI, no public API reference and no
  developer portal — the Company Integration API and Company Benefit Details API
  reference is released to carriers, payroll companies and other partners through
  technical onboarding. Only conventions observable from anonymous probes and the
  public identity discovery document are recorded here. Everything else is marked
  unknown rather than guessed; NOTHING below is inferred from a comparable
  vendor. Because idempotency could not be observed, no Idempotency pointer is
  wired in apis.yml.
authentication:
  style: OAuth 2.0 bearer token via OpenID Connect
  issuer: https://www.employeenavigator.com/identity
  token_endpoint: https://www.employeenavigator.com/identity/connect/token
  partner_grant: clientCredentials
  interactive_grant: authorizationCode
  pkce: S256
  sender_constraining: DPoP advertised
  scope_model: >-
    One named scope per API service (66 published). A partner token is scoped to
    the specific services it is provisioned for — e.g. CarrierCompanyIntegrationApi,
    HealthPlanManagementApi, EmployeeProfilePayrollApi, WebhookApi.
  see: authentication/employeenavigator-authentication.yml
service_root:
  url: https://www.employeenavigator.com/api
  health_check:
    path: /api/health
    method: GET
    auth: none
    status: 200
    content_type: text/plain
    body: Healthy
  observed_behavior: >-
    The service root returns 403 Forbidden (IIS) to anonymous requests and
    unmatched /api/* paths return a bare HTTP 404 with a zero-length body — not
    the marketing SPA soft-404 — confirming /api is a distinctly routed
    application rather than a wildcard catch-all.
